name: TV app (Android)

on:
  push:
    paths:
      - 'tv-android/**'
      - '.github/workflows/tv-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      # Compile errors as annotations, so they're readable from the run summary and the API.
      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not (find|resolve)' build.log | head -60 | while IFS= read -r line; do
            echo "::error title=Build::${line//%/%25}"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gotvh-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gotvh-tv-apk
          path: tv-android/gotvh-tv.apk

      # A fixed download link for the newest build from main:
      # https://github.com/<owner>/<repo>/releases/download/tv-latest/gotvh-tv.apk
      - name: Publish to the tv-latest release
        # Only main publishes (both branches carry the same commits; two runs would race).
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --cleanup-tag -y || true
          gh release create tv-latest gotvh-tv.apk --prerelease \
            --title "GoTVH TV – latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Sideload gotvh-tv.apk on Android TV / Google TV." \
            --target ${{ github.sha }}
