# GoTVH Admin — production site on raven1
#
#   http://raven1:8090  → admin app, talking to raven1's own Tvheadend (127.0.0.1:9981)
#   http://raven1:8091  → the same app, talking to the spare server on omv-dell (192.168.1.222:9983)
#
# The app is static files (npm run build:admin → dist/gotvh-admin/browser), copied to
# /var/www/gotvh-admin by scripts/deploy-admin.sh. Everything Tvheadend serves (API,
# streams, VLC playlists, recordings, channel icons) is passed through on the same origin,
# so the app's relative /api calls and the Guide's "Watch in VLC" work unchanged.
#
# Install:  sudo cp nginx/gotvh-admin.conf /etc/nginx/sites-available/gotvh-admin
#           sudo ln -sf /etc/nginx/sites-available/gotvh-admin /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $gotvh_admin_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- raven1's Tvheadend
server {
    listen 8090;
    server_name _;
    root /var/www/gotvh-admin;
    index index.html;

    include /etc/nginx/snippets/gotvh-admin-common.conf;

    location ~ ^/(api|stream|play|dvrfile|xmltv|imagecache|comet)(/|$) {
        include /etc/nginx/snippets/gotvh-admin-proxy.conf;
        proxy_pass http://127.0.0.1:9981;
    }
}

# ---------------------------------------------------------------- omv-dell (spare / test)
server {
    listen 8091;
    server_name _;
    root /var/www/gotvh-admin;
    index index.html;

    include /etc/nginx/snippets/gotvh-admin-common.conf;

    location ~ ^/(api|stream|play|dvrfile|xmltv|imagecache|comet)(/|$) {
        include /etc/nginx/snippets/gotvh-admin-proxy.conf;
        proxy_pass http://192.168.1.222:9983;
    }
}
