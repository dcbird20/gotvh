# Passing Tvheadend through on the app's origin.

proxy_http_version 1.1;
# Keep the browser's Host: Tvheadend writes it into VLC playlists (/play/ticket/…), so the
# stream links point back here and work from any machine on the LAN.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Authorization $http_authorization;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $gotvh_admin_upgrade;

# Live streams and long polls: no buffering, no early cut-off.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
client_max_body_size 50m;
