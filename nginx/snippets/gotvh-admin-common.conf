# Shared by both GoTVH Admin sites.

# The app: hashed JS/CSS can be cached for good; index.html never (so a deploy shows up at once).
location / {
    try_files $uri $uri/ /index.html;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# The TV app's newest build, short enough to type on a TV remote: http://raven1:8090/tv
# (redirects to the tv-latest GitHub release, so it always points at the current APK).
location ~ ^/tv/?$ {
    return 302 https://github.com/dcbird20/gotvh/releases/download/tv-latest/gotvh-tv.apk;
}

# HDHomeRun tuner check (Add a source): /hdhr/<LAN IP>/status.json → http://<LAN IP>/status.json.
# Private addresses only, so this can't be used to reach the internet.
location ~ "^/hdhr/(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})/(discover|status|lineup)\.json$" {
    proxy_pass http://$1/$3.json;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}
