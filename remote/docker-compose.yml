# GoTVH away-from-home access, alongside SWAG on raven1 — see docs/remote-access.md first.
#
#   cd ~/Code/gotvh/remote && cp .env.example .env    (fill it in)
#   docker compose up -d --build                  (shows up in Portainer as stack "gotvh-remote")
#   ./install-swag-site.sh                        (adds the web side to SWAG)
#   docker compose down; ./install-swag-site.sh --remove    (switches it all off)
#
# Web (admin app, guide, streams): through SWAG on 443, like Jellyfin.
# Live TV with pause (HTSP): the frontdoor container on its own port (router: TCP 8443 → raven1:8443).
# Certificates and the device list live in $SWAG_DIR/gotvh/, where SWAG can read them.
# The pairing service listens on the home network only — never forward its port.

name: gotvh-remote

services:
  frontdoor:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/gotvh/start.sh"]
    environment:
      HTSP_HOST: ${HTSP_HOST}
      TVH_HTSP: host.docker.internal:9982      # Tvheadend's HTSP port (published by its container)
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontdoor/nginx.conf.in:/etc/gotvh/nginx.conf.in:ro
      - ./frontdoor/start.sh:/etc/gotvh/start.sh:ro
      - ${SWAG_DIR}/gotvh/certs:/certs:ro
      - ${SWAG_DIR}/gotvh/pki:/pki:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # GoTVH's own certificate, *.$BASE_DOMAIN (SWAG's certificate for the base name is untouched).
  acme:
    image: neilpang/acme.sh:3.1.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    env_file: .env        # BASE_DOMAIN, ACME_DNS and the DNS credentials (DuckDNS token)
    volumes:
      - ./acme/start.sh:/start.sh:ro
      - acme:/acme.sh
      - ${SWAG_DIR}/gotvh/certs:/certs

  pair:
    build: ./pair
    image: gotvh-pair:local
    restart: unless-stopped
    environment:
      TV_HOST: ${TV_HOST}
      HTSP_HOST: ${HTSP_HOST}
      HTSP_PORT: "8443"
      TVH_URL: http://host.docker.internal:9981     # to check administrator sign-ins
    ports:
      - "${PAIR_LAN_IP}:8095:8095"                   # home network only (SWAG and the admin app reach it here)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pair:/data
      - ${SWAG_DIR}/gotvh/pki:/pki
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  acme:
  pair:
